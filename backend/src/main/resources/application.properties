spring.application.name=backend
spring.datasource.url=jdbc:mysql://127.0.0.1:3308/ecommerce_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# File upload configuration
file.upload.dir=C:/xampp/htdocs/Ecommerce-app/backend/uploads/packages
file.upload.url=http://localhost:8080/uploads/packages/

jwt.secret=my-super-secret-key-that-is-at-least-256-bits-long!!!
jwt.expiration=86400000

server.port=8080

# Mail configuration (order confirmation notifications)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
